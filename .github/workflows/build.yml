name: Build catalog

on:
  pull_request:
    paths: [tools.yaml, scripts/**]
  push:
    branches: [main]
    paths: [tools.yaml, scripts/**]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      # On pull requests: only validate the YAML (fails on errors).
      - name: Validate
        if: github.event_name == 'pull_request'
        run: python scripts/build_catalog.py

      # On main: regenerate README.md and catalog.csv, commit if changed.
      - name: Rebuild and commit
        if: github.event_name == 'push'
        run: |
          python scripts/build_catalog.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md catalog.csv
            git commit -m "Rebuild catalog [skip ci]"
            git push
          fi
