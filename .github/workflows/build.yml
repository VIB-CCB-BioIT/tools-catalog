name: Rebuild catalog

# Runs on pull requests only (main is protected, so bots cannot push to it).
# For pull requests from branches of this repo, the regenerated files are
# committed to the PR branch. For forks, the files are only validated; the
# maintainer re-runs scripts/build_catalog.py after merging if needed.
on:
  pull_request:
    paths: [tools.yaml, scripts/**]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate and rebuild
        run: python scripts/build_catalog.py
      - name: Commit regenerated files (same-repo PRs only)
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md catalog.csv
            git commit -m "Rebuild catalog [skip ci]"
            git push
          fi
