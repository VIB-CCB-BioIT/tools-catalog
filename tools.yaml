    step: Registration
    topic: Any
    language: Python (dask, opencl)
    status: internal
    repo: ""
    contact: Marcel Issler
    lab: CoSc
    share: yes
    notes: Private GitHub repo.

  - id: napari-fast4dreg
    name: napari-fast4dreg
    category: Imaging & microscopy
    summary: Fast rigid registration for large volumetric time-lapse series.
    data: Microscope volumetric time-series
