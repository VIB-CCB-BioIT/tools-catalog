# VIB-CCB-BioIT tools & pipelines catalog.
# Edit this file (via pull request); README.md and catalog.csv are generated from it.
#
# Fields
#   id        unique slug (lowercase, dashes)
#   name      display name
#   category  one of the categories listed in scripts/build_catalog.py
#   summary   one line: what it does (input -> output)
#   data      data type
#   step      analysis step (End-to-end, QC, Registration, ...)
#   topic     disease / topic (optional)
#   language  language / framework
#   status    public    = open repository, anyone can use it (set `repo`)
#             internal  = exists in the center, ask the contact (or private repo)
#             building  = in development
#   repo      URL of the GitHub repository (leave empty if none / private)
#   contact   person in charge 
#   lab       group / lab
#   share     yes = owner is willing to share / package it
#   notes     free text (optional)
#
# Imported from CCB_bioinfo_lunch_9Nov2026.xlsx. Names marked "(name TBD)" had no
# tool name in the sheet — please rename. Public entries without `repo` need a URL.

tools:
