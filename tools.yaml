    language: Python (dask, pytorch, napari)
    status: building
    repo: ""
    contact: Marcel Issler
    lab: CoSc
    share: yes

  - id: 5d-ktr-pipeline
    name: 5D-KTR-pipeline
    category: Imaging & microscopy
    summary: Quantifies spatio-temporal kinase translocation dynamics (nuclear vs cytosolic signal), including segmentation and morphological features.
    data: Kinase-translocation-sensor volumetric time-lapse
    step: End-to-end
